<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROBO SCHOOL — десктоп и телефон</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{display:flex;background:#e9e9ee;font-family:Arial,sans-serif}
.pane{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:10px}
#left{flex:1 1 60%}
#right{flex:1 1 40%;border-left:1px solid #ccc}
.label{font-size:14px;color:#555}
.screen{position:relative;overflow:hidden;background:#fff}
.desk{border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.phone{border:12px solid #141024;border-radius:36px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
iframe{border:0;position:absolute;top:0;left:0;transform-origin:0 0}
</style>
</head>
<body>
<div class="pane" id="left">
 <div class="label">Десктоп (1440 px)</div>
 <div class="screen desk" id="d"><iframe src="index.html" id="fd"></iframe></div>
</div>
<div class="pane" id="right">
 <div class="label">Телефон (320 px)</div>
 <div class="screen phone" id="p"><iframe src="index.html" id="fp"></iframe></div>
</div>
<script>
function fit(){
  // десктоп: ширина 1440, подгоняем по доступной ширине/высоте левой панели
  var L=document.getElementById('left'),dw=1440,dh=900;
  var s=Math.min((L.clientWidth-32)/dw,(L.clientHeight-80)/dh);
  var d=document.getElementById('d'),fd=document.getElementById('fd');
  d.style.width=dw*s+'px';d.style.height=dh*s+'px';
  fd.style.width=dw+'px';fd.style.height=dh+'px';fd.style.transform='scale('+s+')';
  // телефон: 320x568 внутри рамки
  var R=document.getElementById('right'),pw=320,ph=568;
  var t=Math.min((R.clientWidth-32-24)/pw,(R.clientHeight-80-24)/ph,1.3);
  var p=document.getElementById('p'),fp=document.getElementById('fp');
  p.style.width=pw*t+24+'px';p.style.height=ph*t+24+'px';
  fp.style.width=pw+'px';fp.style.height=ph+'px';fp.style.transform='scale('+t+')';
}
addEventListener('resize',fit);fit();
</script>
</body>
</html>
